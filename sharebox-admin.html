<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — ShareBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0e8a5c;--g2:#0a6b47;--bg:#eef3ec;--ink:#142019;--mut:#65756b;--card:rgba(255,255,255,.75);--line:rgba(20,32,25,.1);--red:#bb4638;--amber:#a66b10}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 10%,#d9f1e5,transparent 35%),var(--bg);color:var(--ink);font-family:Inter,sans-serif}.wrap{max-width:1280px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:10px;font:800 24px 'Bricolage Grotesque'}.logo{width:38px;height:38px;border-radius:50%;background:var(--g);display:grid;place-items:center;color:#fff}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:var(--g);color:#fff}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.panel{background:var(--card);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.8);border-radius:22px;box-shadow:0 16px 50px rgba(20,32,25,.09);padding:20px;margin-bottom:18px}.login{max-width:520px;margin:70px auto}.field{display:grid;gap:7px}.field input,.search{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:#fff;font:inherit}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat strong{font:800 30px 'Bricolage Grotesque';display:block}.tabs{display:flex;gap:8px;margin:18px 0}.tab{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-weight:700;cursor:pointer}.tab.active{background:var(--g);color:#fff}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:900px;background:rgba(255,255,255,.72)}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f5faf7;font-size:12px;text-transform:uppercase;letter-spacing:.04em}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-weight:700;font-size:11px}.approved{background:#dff4e9;color:#096b46}.pending{background:#fff0ce;color:#855400}.rejected{background:#f9dfdc;color:#9c2f24}.actions{display:flex;gap:5px}.small{padding:7px 9px;font-size:11px}.empty{text-align:center;padding:35px;color:var(--mut)}.hidden{display:none}.error{color:var(--red);font-size:13px;margin-top:8px}@media(max-width:700px){.wrap{padding:14px}.stats{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.toolbar{flex-direction:column;align-items:stretch}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="brand"><span class="logo">↗</span>ShareBox Admin</div><div><a class="btn ghost" href="sharebox-dashboard-glass.html">← Dashboard</a> <button id="logoutBtn" class="btn ghost hidden">Lock admin</button></div></div>
<section id="loginPanel" class="panel login"><h1>Admin login</h1><p style="color:var(--mut)">Admin credentials are verified from the PostgreSQL <b>admins</b> table.</p><div class="field"><label for="adminEmail">Admin email</label><input id="adminEmail" type="email" autocomplete="username" value="admin@sharebox.local"></div><div class="field" style="margin-top:12px"><label for="adminPassword">Password</label><input id="adminPassword" type="password" autocomplete="current-password" placeholder="Your ADMIN_PASSWORD or ADMIN_KEY"></div><button id="unlockBtn" class="btn primary" style="margin-top:14px;width:100%">Log in as admin</button><div id="loginError" class="error"></div></section>
<main id="adminPanel" class="hidden">
<div class="stats"><section class="panel stat"><span>Registered users</span><strong id="userCount">0</strong></section><section class="panel stat"><span>Resources</span><strong id="productCount">0</strong></section><section class="panel stat"><span>Pending verification</span><strong id="pendingCount">0</strong></section></div>
<div class="tabs"><button class="tab active" data-tab="users">Users</button><button class="tab" data-tab="products">Products / resources</button></div>
<section class="panel"><div class="toolbar"><input id="search" class="search" placeholder="Search name, email, Student ID, product or category"><button id="refreshBtn" class="btn ghost">Refresh</button></div>
<div id="usersView"><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Student ID</th><th>Department</th><th>Year</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody id="usersBody"></tbody></table></div></div>
<div id="productsView" class="hidden"><div class="table-wrap"><table><thead><tr><th>Item</th><th>Owner</th><th>Category</th><th>Type</th><th>Location</th><th>Contact</th><th>Views</th><th>Created</th><th>Actions</th></tr></thead><tbody id="productsBody"></tbody></table></div></div>
<div id="adminError" class="error"></div></section></main></div>
<script src="api-config.js"></script><script>
const API=(window.SHAREBOX_API_URL||'').replace(/\/$/,'');let token=sessionStorage.getItem('sharebox_admin_token')||'';let users=[],products=[],tab='users';
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function request(path,options={}){const headers={...(options.headers||{})};if(token)headers.Authorization='Bearer '+token;if(options.body&&!headers['Content-Type'])headers['Content-Type']='application/json';const r=await fetch(API+path,{...options,headers});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.message||'Request failed');return d}
async function login(){try{$('loginError').textContent='';const out=await request('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('adminEmail').value.trim(),password:$('adminPassword').value})});token=out.token;sessionStorage.setItem('sharebox_admin_token',token);await load()}catch(e){$('loginError').textContent=e.message}}
async function load(){try{const [u,p]=await Promise.all([request('/api/admin/users'),request('/api/admin/products')]);users=u.users||[];products=p.products||[];$('userCount').textContent=users.length;$('productCount').textContent=products.length;$('pendingCount').textContent=users.filter(x=>x.id_verification_status==='pending').length;render();showAdmin()}catch(e){$('loginError').textContent=e.message;sessionStorage.removeItem('sharebox_admin_token');token=''}}
function showAdmin(){$('loginPanel').classList.add('hidden');$('adminPanel').classList.remove('hidden');$('logoutBtn').classList.remove('hidden')}
function render(){const q=$('search').value.trim().toLowerCase();const uf=users.filter(u=>[u.name,u.email,u.student_id,u.department,u.academic_year,u.id_verification_status].join(' ').toLowerCase().includes(q));$('usersBody').innerHTML=uf.length?uf.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td>${esc(u.student_id)}</td><td>${esc(u.department)}</td><td>${esc(u.academic_year)}</td><td><span class="badge ${esc(u.id_verification_status)}">${esc(u.id_verification_status)}</span></td><td>${new Date(u.created_at).toLocaleString()}</td><td><div class="actions"><button class="btn small primary" onclick="verifyUser('${u.id}','approved')">Approve</button><button class="btn small ghost" onclick="verifyUser('${u.id}','pending')">Pending</button><button class="btn small ghost" onclick="verifyUser('${u.id}','rejected')">Reject</button></div></td></tr>`).join(''):`<tr><td colspan="8" class="empty">No users found.</td></tr>`;
const pf=products.filter(p=>[p.name,p.ownerName,p.category,p.subcategory,p.type,p.location,p.contact,p.status,(p.tags||[]).join(' ')].join(' ').toLowerCase().includes(q));$('productsBody').innerHTML=pf.length?pf.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small>${esc((p.tags||[]).join(', '))}</small></td><td>${esc(p.ownerName)}</td><td>${esc(p.category)} / ${esc(p.subcategory)}</td><td>${esc(p.type)}</td><td>${esc(p.location)}</td><td>${esc(p.contact)}</td><td>${Number(p.views||0)}</td><td>${new Date(p.createdAt).toLocaleString()}</td><td><div class="actions"><button class="btn small ghost" onclick="deleteProduct('${p.id}')">Delete</button></div></td></tr>`).join(''):`<tr><td colspan="9" class="empty">No products found.</td></tr>`}
async function verifyUser(id,status){try{await request('/api/admin/users/'+id+'/verification',{method:'PATCH',body:JSON.stringify({status})});await load()}catch(e){$('adminError').textContent=e.message}}
async function deleteProduct(id){if(!confirm('Delete this product permanently?'))return;try{await request('/api/admin/products/'+id,{method:'DELETE'});await load()}catch(e){$('adminError').textContent=e.message}}
$('unlockBtn').onclick=login;$('adminPassword').onkeydown=e=>{if(e.key==='Enter')login()};$('logoutBtn').onclick=()=>{sessionStorage.removeItem('sharebox_admin_token');location.reload()};$('refreshBtn').onclick=load;$('search').oninput=render;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));$('usersView').classList.toggle('hidden',tab!=='users');$('productsView').classList.toggle('hidden',tab!=='products')});if(token)load();
</script></body></html>
