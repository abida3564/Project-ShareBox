<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings — ShareBox</title>
<style>:root{--g:#0e8a5c;--bg:#eef3ec;--ink:#142019;--mut:#617268;--line:#d9e3dc}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial;color:var(--ink)}.wrap{max-width:760px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 18px 50px #14201912}.row{display:flex;justify-content:space-between;gap:15px;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{color:var(--mut)}input[type=checkbox]{width:22px;height:22px;accent-color:var(--g)}select{padding:10px;border:1px solid var(--line);border-radius:10px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none}.primary{background:var(--g);color:#fff}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}</style></head><body><div class="wrap"><div class="top"><h1>Settings</h1><a class="btn ghost" href="sharebox-dashboard-glass.html">Dashboard</a></div><section class="card"><div class="row"><div><b>Email notifications</b><br><small>Receive updates about requests and messages</small></div><input id="emailNotifications" type="checkbox"></div><div class="row"><div><b>Dark mode</b><br><small>Use a darker interface preference</small></div><input id="darkMode" type="checkbox"></div><div class="row"><div><b>Profile visibility</b><br><small>Choose who can view your profile</small></div><select id="visibility"><option value="campus">Campus only</option><option value="private">Private</option></select></div><button id="save" class="btn primary" style="margin-top:18px">Save settings</button><span id="status" style="margin-left:12px"></span></section></div><script src="api-config.js"></script><script src="app-core.js"></script><script>
async function load(){try{const o=await ShareBox.api('/api/my/settings'),s=o.settings||{};emailNotifications.checked=!!s.emailNotifications;darkMode.checked=!!s.darkMode;visibility.value=s.visibility||'campus'}catch(e){status.textContent=e.message}}save.onclick=async()=>{try{const o=await ShareBox.api('/api/my/settings',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({emailNotifications:emailNotifications.checked,darkMode:darkMode.checked,visibility:visibility.value})});status.textContent='Saved ✓'}catch(e){status.textContent=e.message}};load();
</script></body></html>
