<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messages — ShareBox</title>
<style>
:root{--g:#0e8a5c;--bg:#eef3ec;--ink:#142019;--mut:#617268;--card:#ffffffd9;--line:#d9e3dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 5%,#d8f1e5,transparent 35%),var(--bg);font-family:Inter,Arial;color:var(--ink)}.wrap{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800;font-size:24px}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none}.primary{background:var(--g);color:#fff}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.card{background:var(--card);border:1px solid #fff;border-radius:22px;box-shadow:0 18px 50px #14201914;padding:20px}.msgs{height:55vh;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:8px}.bubble{max-width:72%;padding:11px 14px;border-radius:16px;background:#fff;border:1px solid var(--line)}.mine{align-self:flex-end;background:#dff3e9}.meta{font-size:11px;color:var(--mut);margin-top:5px}.composer{display:grid;grid-template-columns:180px 1fr auto;gap:8px;margin-top:14px}.composer input{height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit}@media(max-width:700px){.composer{grid-template-columns:1fr}.bubble{max-width:90%}}</style></head><body><div class="wrap"><header class="top"><div class="brand">↗ ShareBox Messages</div><a class="btn ghost" href="sharebox-dashboard-glass.html">Dashboard</a></header><section class="card"><div id="messages" class="msgs">Loading messages…</div><form id="form" class="composer"><input id="receiver" placeholder="Recipient name (optional)"><input id="body" placeholder="Write a message…" required><button class="btn primary">Send</button></form></section></div><script src="api-config.js"></script><script src="app-core.js"></script><script>
const box=document.getElementById('messages'),me=ShareBox.currentUser();const esc=s=>ShareBox.escapeHtml?ShareBox.escapeHtml(s):String(s);
async function load(){try{const o=await ShareBox.api('/api/messages');const a=o.messages||[];box.innerHTML=a.length?a.map(m=>`<div class="bubble ${m.senderId===me?.id?'mine':''}"><b>${esc(m.senderName||'User')}</b><div>${esc(m.body)}</div><div class="meta">${new Date(m.createdAt).toLocaleString()}</div></div>`).join(''):'<p>No messages yet. Start a conversation.</p>';box.scrollTop=box.scrollHeight}catch(e){box.textContent=e.message}}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();try{await ShareBox.api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({receiverName:document.getElementById('receiver').value.trim(),body:document.getElementById('body').value.trim()})});document.getElementById('body').value='';load()}catch(err){alert(err.message)}};load();
</script></body></html>
