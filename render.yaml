databases:
  - name: sharebox-postgres
    plan: free
    databaseName: sharebox
    user: sharebox_user

services:
  - type: web
    name: sharebox-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://keyacse.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: sharebox-postgres
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
