<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resources — ShareBox</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0e8a5c;--g2:#08704a;--bg:#eef3ec;--ink:#142019;--mut:#617268;--line:rgba(20,32,25,.1);--card:rgba(255,255,255,.78);--red:#b33e34;--amber:#a66b10}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 5%,#d8f1e5,transparent 34%),var(--bg);font-family:Inter,sans-serif;color:var(--ink)}
.wrap{max-width:1260px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{font:800 24px "Bricolage Grotesque";display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--g);color:white}.nav{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--g);color:white}.ghost{background:white;color:var(--ink);border:1px solid var(--line)}
.hero,.card,.toolbar{background:var(--card);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.85);box-shadow:0 15px 45px rgba(20,32,25,.08);border-radius:22px}.hero{padding:24px;margin-bottom:16px}.hero h1{font:800 34px "Bricolage Grotesque";margin:0 0 6px}.hero p{margin:0;color:var(--mut)}
.toolbar{padding:14px;display:flex;gap:10px;margin-bottom:18px}.toolbar input,.toolbar select{height:45px;border:1px solid var(--line);border-radius:12px;background:white;padding:0 13px;font:inherit}.toolbar input{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}.card{overflow:hidden}.photo{height:180px;background:#dde8e0 center/cover no-repeat;display:grid;place-items:center;font-size:48px}.body{padding:16px}.meta{font-size:12px;font-weight:700;color:var(--g);text-transform:uppercase}.body h2{font:800 21px "Bricolage Grotesque";margin:6px 0}.small{color:var(--mut);font-size:13px}.price{font-weight:800;margin:12px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.approved{background:#dbf3e6;color:#086844}.pending{background:#fff0ca;color:#805000}.rejected{background:#f8ddda;color:#962e25}.empty{text-align:center;padding:50px;color:var(--mut);grid-column:1/-1}.modal{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;place-items:center;padding:20px;z-index:20}.modal.open{display:grid}.modalbox{background:white;border-radius:18px;padding:20px;width:min(520px,100%)}.modalbox input,.modalbox textarea{width:100%;margin:7px 0 12px;border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit}.modalbox textarea{min-height:100px}
@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.toolbar{flex-direction:column}.hero h1{font-size:28px}}
</style></head>
<body><div class="wrap">
<header class="top"><div class="brand"><span class="logo">↗</span>ShareBox</div><nav class="nav"><a class="btn ghost" href="sharebox-dashboard-glass.html">Dashboard</a><a class="btn ghost" href="sharebox-account.html">Profile</a><a class="btn primary" href="sharebox-upload-wizard.html">+ Share item</a></nav></header>
<section class="hero"><h1 id="title">Browse resources</h1><p id="subtitle">Explore approved resources shared by UITS students.</p></section>
<section class="toolbar"><input id="search" placeholder="Search items, categories, tags or owners"><select id="category"><option value="">All categories</option></select><button class="btn ghost" id="refresh">Refresh</button></section>
<main class="grid" id="grid"><div class="empty">Loading resources…</div></main>
</div>
<div class="modal" id="editModal"><form class="modalbox" id="editForm"><h2>Edit resource</h2><input id="editName" required placeholder="Item name"><textarea id="editDesc" placeholder="Description"></textarea><input id="editContact" placeholder="Contact number"><div class="actions"><button class="btn primary" type="submit">Save changes</button><button class="btn ghost" type="button" id="closeModal">Cancel</button></div></form></div>
<script src="api-config.js"></script><script src="app-core.js"></script><script>
const mode=new URLSearchParams(location.search).get('view')==='mine'?'mine':'browse';
let products=[],editing=null;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function price(p){if(p.type==='donate')return'Free donation';if(p.type==='sell')return ShareBox.money(p.sellPrice);if(p.type==='borrow')return'Borrow · deposit '+ShareBox.money(p.deposit);return[p.perHour&&ShareBox.money(p.perHour)+'/hour',p.perDay&&ShareBox.money(p.perDay)+'/day',p.perWeek&&ShareBox.money(p.perWeek)+'/week'].filter(Boolean).join(' · ')||'Contact owner'}
async function load(){try{const out=await ShareBox.api(mode==='mine'?'/api/my/products':'/api/products');products=out.products||[];buildCats();render()}catch(e){$('grid').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function buildCats(){const old=$('category').value;const cats=[...new Set(products.map(p=>p.category).filter(Boolean))].sort();$('category').innerHTML='<option value="">All categories</option>'+cats.map(c=>'<option>'+esc(c)+'</option>').join('');$('category').value=old}
function render(){const q=$('search').value.toLowerCase().trim(),cat=$('category').value;const list=products.filter(p=>(!cat||p.category===cat)&&[p.name,p.category,p.subcategory,p.ownerName,p.description,...(p.tags||[])].join(' ').toLowerCase().includes(q));$('grid').innerHTML=list.length?list.map(p=>`<article class="card"><div class="photo" style="${p.photos?.[0]?`background-image:url('${p.photos[0]}')`:''}">${p.photos?.[0]?'':'📦'}</div><div class="body"><div class="meta">${esc(p.type||'share')} · ${esc(p.category||'Other')}</div><h2>${esc(p.name)}</h2><div class="small">${esc(p.ownerName||'Campus member')} · ${esc(p.location||'UITS')}</div>${mode==='mine'?`<p><span class="badge approved">Published</span> · ${Number(p.views||0)} views</p>`:''}<div class="price">${esc(price(p))}</div><div class="actions"><a class="btn primary" href="sharebox-item-details.html?id=${encodeURIComponent(p.id)}">View</a>${mode==='mine'?`<button class="btn ghost" onclick="openEdit('${p.id}')">Edit</button><button class="btn ghost" onclick="removeItem('${p.id}')">Delete</button>`:''}</div></div></article>`).join(''):`<div class="empty">${mode==='mine'?'You have not published any resources yet.':'No resources match your search.'}</div>`}
window.openEdit=id=>{editing=products.find(p=>p.id===id);if(!editing)return;$('editName').value=editing.name||'';$('editDesc').value=editing.description||'';$('editContact').value=editing.contact||'';$('editModal').classList.add('open')};
window.removeItem=async id=>{if(!confirm('Delete this resource permanently?'))return;try{await ShareBox.api('/api/my/products/'+id,{method:'DELETE'});products=products.filter(p=>p.id!==id);render()}catch(e){alert(e.message)}};
$('editForm').onsubmit=async e=>{e.preventDefault();try{const out=await ShareBox.api('/api/my/products/'+editing.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('editName').value.trim(),description:$('editDesc').value.trim(),contact:$('editContact').value.trim()})});products=products.map(p=>p.id===editing.id?out.product:p);$('editModal').classList.remove('open');render()}catch(err){alert(err.message)}};
$('closeModal').onclick=()=>$('editModal').classList.remove('open');$('search').oninput=render;$('category').onchange=render;$('refresh').onclick=load;
if(mode==='mine'){$('title').textContent='My Resources';$('subtitle').textContent='Only resources published by your logged-in account are shown here.'}
load();
</script></body></html>
